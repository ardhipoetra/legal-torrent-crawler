name: Dependabot alert triage

# PoC: dismisses open Dependabot alerts in THIS repository that match an
# approved rule in .github/dependabot-triage-rules.yml.
#
# Token: short-lived GitHub App installation token. The App has only the
# repository permission "Dependabot alerts: Read and write" and is installed on
# the repos to triage. Actions secrets: DEPENDABOT_TRIAGE_APP_CLIENT_ID and
# DEPENDABOT_TRIAGE_APP_PRIVATE_KEY.
on:
  schedule:
    - cron: "14 5 * * *"  # daily, 05:14 UTC
  push:
    branches: [master] #TODO: new repo = main
    paths:
      - .github/dependabot-triage-rules.yml
      - triage/dependabot_triage.py
  workflow_dispatch:
    inputs:
      dry_run:
        description: Only report matching alerts, don't dismiss
        type: boolean
        default: true

permissions: {}

concurrency:
  group: dependabot-triage
  cancel-in-progress: false

jobs:
  triage:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - run: pip install --require-hashes -r triage/requirements.txt

      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          client-id: ${{ secrets.DEPENDABOT_TRIAGE_APP_CLIENT_ID }}
          private-key: ${{ secrets.DEPENDABOT_TRIAGE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          permission-vulnerability-alerts: write

      - name: Triage
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}  # to triage another repo, set this to "owner/repo"
          # scheduled and push  => runs apply
          # manual runs         => dry runs unless unticked.
          APPLY: ${{ github.event_name != 'workflow_dispatch' || inputs.dry_run == false }}
        run: |
          args=(--config .github/dependabot-triage-rules.yml --repo "$REPO")
          if [ "$APPLY" = "true" ]; then args+=(--apply); fi
          python triage/dependabot_triage.py "${args[@]}"