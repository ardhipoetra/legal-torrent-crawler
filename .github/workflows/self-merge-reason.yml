# Self-contained self-merge-reason gate: copy this ONE file to .github/workflows/ in each repo.
# No reference to any other repo, server or relay; each repo's gate only depends on GitHub Actions itself.
# Status "self-merge-reason" on the PR head commit:
#   success - approved by someone other than the author, or the PR description / a new comment has
#             "Self-merge reason: <at least 15 chars>" (credited to whoever wrote it)
#   pending - neither yet; one reminder comment is posted (not on drafts) and edited once resolved
# Source of truth for the gate (the older two-file variant in variants/ is no longer maintained).
name: self-merge-reason
on:
  pull_request:
    types:
    - opened
    - reopened
    - synchronize
    - ready_for_review
    - edited
  pull_request_review:
    types:
    - submitted
    - dismissed
  issue_comment:
    types:
    - created
    - edited
concurrency:
  group: self-merge-reason-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: true
permissions: {}
jobs:
  self-merge-reason:
    # Skip comments on plain issues (issue_comment also fires there).
    if: github.event_name != 'issue_comment' || github.event.issue.pull_request
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      statuses: write
      pull-requests: write
      contents: read
    steps:
    - name: Evaluate approval or self-merge reason
      env:
        GH_TOKEN: ${{ github.token }}
        REPO: ${{ github.repository }}
        PR: ${{ github.event.pull_request.number || github.event.issue.number }}
        MIN_REASON_CHARS: '15'
      run: |
        set -euo pipefail
        # One GraphQL call for everything: PR state and head commit, the description and its last editor,
        # each reviewer's latest approve/reject verdict, and the comments with their last editors.
        q='query($owner:String!,$name:String!,$n:Int!){repository(owner:$owner,name:$name){pullRequest(number:$n){
            state isDraft headRefOid body
            author{login ...on User{name}} editor{login ...on User{name}}
            latestOpinionatedReviews(first:100){nodes{state author{login}}}
            comments(last:100){nodes{databaseId body author{__typename login ...on User{name}} editor{login ...on User{name}}}}}}}'
        pr=$(gh api graphql -f query="$q" -F owner="${REPO%%/*}" -F name="${REPO#*/}" -F n="$PR" --jq .data.repository.pullRequest)
        if [ "$(jq -r .state <<<"$pr")" != OPEN ]; then echo "PR #$PR is not open, nothing to do"; exit 0; fi

        # approved: someone other than the author whose latest verdict is APPROVED.
        # reason: the "Self-merge reason: ..." line from the description, else from the last comment written by a
        # person (the bot's own comment never counts, even if someone edits it). Text inside <!-- --> and the
        # reminder's example text are ignored. "editor" is whoever last edited that text, so the reason is
        # credited to the person who wrote it.
        IFS=$'\x1f' read -r approved reason reason_by reason_src < <(jq -r '
          def who: (. // {login: "ghost"}) | if (.name // "") != "" then "\(.name) (@\(.login))" else "@\(.login)" end;
          def reason: gsub("<!--[\\s\\S]*?-->"; "")
            | [scan("(?i)(?:^|\\n)[ \\t>*_-]*self-merge reason[ \\t*_]*:[ \\t*_]*([^\\r\\n]*)")[0] | sub("\\s+$"; "")]
            | map(select(. != "" and (test("why this can.t wait for a review"; "i") | not)))
            | last // "";
          .author.login as $author
          | ([.latestOpinionatedReviews.nodes[] | select(.state == "APPROVED" and .author.login != $author)] | length > 0) as $approved
          | ((.body // "" | reason) as $r
             | if $r != "" then {r: $r, by: ((.editor // .author) | who), src: "the PR description"}
               else [.comments.nodes[] | select(.author.__typename == "User")
                     | {r: (.body | reason), by: ((.editor // .author) | who), src: "a comment"} | select(.r != "")]
                    | last // {r: "", by: "", src: ""} end) as $pick
          | [$approved, $pick.r, $pick.by, $pick.src] | map(tostring) | join("\u001f")' <<<"$pr")

        # A commit status, not a check run: the latest status per context wins and can go back to
        # pending. (Pilot 2026-11-06: rulesets kept reporting an API-created check run as "expected".)
        if [ "$approved" = true ]; then
          state=success; desc="Approved by another contributor"
        elif [ "${#reason}" -ge "$MIN_REASON_CHARS" ]; then
          state=success; desc="Authorized by ${reason_by}: $reason"
        else
          state=pending; desc="Needs an approval or a 'Self-merge reason: ...' line (${MIN_REASON_CHARS}+ chars)"
        fi
        desc=${desc:0:140}  # GitHub limit for status descriptions

        # One bot comment per PR, found by its hidden marker: the reminder while pending, the record once resolved.
        marker='<!-- self-merge-reason-bot -->'
        bot='first(.comments.nodes[] | select(.author.__typename == "Bot" and (.body | contains($m))))'
        bot_id=$(jq -r --arg m "$marker" "($bot | .databaseId) // \"\"" <<<"$pr")
        bot_body=$(jq -r --arg m "$marker" "($bot | .body) // \"\"" <<<"$pr")
        if [ "$state" = pending ]; then
          new_body="$marker
        **Merging without a review?** This repository needs an approval from someone other than the author, or a reason.
        If you merge this yourself, copy this line into the PR description or a **new comment**, then add why this can't wait for a review (at least ${MIN_REASON_CHARS} characters):

        \`\`\`
        Self-merge reason:
        \`\`\`

        Editing this comment does not count (it is reset automatically). If someone reviews this PR, you can ignore this."
        elif [ "$approved" = true ]; then
          new_body="$marker
        ✅ Approved by another contributor. No self-merge reason needed."
        else
          new_body="$marker
        ✅ ${reason_by} authorized self merge due to reason: ${reason:0:500}

        <sub>Reason taken from ${reason_src}.</sub>"
        fi
        if [ -z "$bot_id" ]; then
          # Create it as the reminder (pending, not on drafts) or, when a self-merge reason is used, as the record,
          # so every self-merge leaves a "✅ … authorized self merge" comment to read later.
          if { [ "$state" = pending ] && [ "$(jq -r .isDraft <<<"$pr")" != true ]; } || { [ "$state" = success ] && [ "$approved" != true ]; }; then
            comment_action=create; else comment_action=none; fi
        elif [ "$bot_body" != "$new_body" ]; then comment_action=update; else comment_action=none; fi

        gh api -X POST "repos/$REPO/statuses/$(jq -r .headRefOid <<<"$pr")" -f context=self-merge-reason -f state="$state" \
          -f description="$desc" -f target_url="${GITHUB_SERVER_URL}/${REPO}/actions/runs/${GITHUB_RUN_ID}" >/dev/null
        case $comment_action in
          create) gh api -X POST "repos/$REPO/issues/$PR/comments" -f body="$new_body" >/dev/null ;;
          update) gh api -X PATCH "repos/$REPO/issues/comments/$bot_id" -f body="$new_body" >/dev/null ;;
        esac
        echo "self-merge-reason: $state | $desc | comment: $comment_action"
