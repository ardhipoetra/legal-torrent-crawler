name: Dependabot alert triage

# PoC: dismisses open Dependabot alerts in THIS repository that match an
# approved rule in .github/dependabot-triage-rules.yml.
#
# Token: Actions repository secret DEPENDABOT_ALERTRW_TOKEN, a fine-grained PAT
# with repository permission "Dependabot alerts: Read and write" on this repo.
on:
  schedule:
    - cron: "14 5 * * *"  # daily, 05:14 UTC
  push:
    branches: [master] #TODO: new repo = main
    paths:
      - .github/dependabot-triage-rules.yml
      - scripts/dependabot_triage.py
  workflow_dispatch:
    inputs:
      dry_run:
        description: Only report matching alerts, don't dismiss
        type: boolean
        default: true

permissions: {}

concurrency:
  group: dependabot-triage
  cancel-in-progress: false

jobs:
  triage:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - run: pip install --require-hashes -r scripts/requirements.txt

      - name: Triage
        env:
          GH_TOKEN: ${{ secrets.DEPENDABOT_ALERTRW_TOKEN }}
          REPO: ${{ github.repository }}  # to triage another repo, set this to "owner/repo"
          # scheduled and push  => runs apply
          # manual runs         => dry runs unless unticked.
          APPLY: ${{ github.event_name != 'workflow_dispatch' || inputs.dry_run == false }}
        run: |
          args=(--config .github/dependabot-triage-rules.yml --repo "$REPO")
          if [ "$APPLY" = "true" ]; then args+=(--apply); fi
          python scripts/dependabot_triage.py "${args[@]}"